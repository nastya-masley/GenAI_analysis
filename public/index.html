<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AEMA</title>
    <link rel="icon" type="image/svg+xml" href="/assets/AEMA_logo.svg" />
    <!-- Warm up third-party origins used for MediaPipe WASM and the Gemini API -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="//storage.googleapis.com" />
    <link rel="dns-prefetch" href="//generativelanguage.googleapis.com" />
    <link rel="preload" as="image" href="/assets/AEMA_logo.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/assets/checkbox.png" />
    <link rel="preload" as="image" href="/assets/checkbox_crossed.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loader-overlay" class="loader-overlay">
      <div id="loader-logo" class="loader-logo" aria-hidden="true">
        <img class="loader-logo-img" src="/assets/AEMA_logo.svg" alt="" />
        <span class="loader-logo-shine"></span>
      </div>
    </div>

    <div id="workspace-root" class="workspace-root" hidden>
      <main class="container">
        <section class="workspace">
          <div class="mode-bar" id="mode-bar">
            <button type="button" class="mode-btn" data-mode="edit">Processing</button>
            <button type="button" class="mode-btn" data-mode="archive">Archive</button>
            <button type="button" class="mode-btn active" data-mode="live">Live</button>
          </div>
          <div class="workspace-body">
          <form id="analyze-form" class="controls-panel hidden">
            <section class="control-section">
              <h2 class="control-title">Video</h2>
              <section class="field">
                <label class="upload-btn">
                  <input type="file" id="video" name="video" accept="video/*,image/jpeg,image/png" />
                  <span id="upload-btn-label">Select file</span>
                </label>
                <span id="selected-file-hint" class="help-text" hidden></span>
              </section>
            </section>

            <section class="control-section">
              <details class="cv-dropdown"><summary class="control-title cv-summary">Computer vision</summary>
                <div class="face-controls stacked">
                  <div class="video-bg-control">
                    <label class="toggle">
                      <input type="checkbox" id="toggle-video-bg" checked />
                      <span>Background</span>
                    </label>
                    <label class="upload-btn" id="background-image-btn" style="display: none;">
                      <input type="file" id="background-image" accept="image/*" />
                      <span>Choose background</span>
                    </label>
                  </div>
                  <label class="toggle">
                    <input type="checkbox" id="toggle-inverted-mode" />
                    <span>Inverted mode</span>
                  </label>
                  <label class="toggle">
                    <input type="checkbox" id="toggle-face" checked />
                    <span>Face landmarks</span>
                  </label>
                  <label class="toggle">
                    <input type="checkbox" id="toggle-hand" checked />
                    <span>Hand landmarks</span>
                  </label>
                  <!-- Pose landmarks: enabled by default -->
                  <label class="toggle">
                    <input type="checkbox" id="toggle-pose" checked />
                    <span>Pose landmarks</span>
                  </label>
                  <label class="toggle">
                    <input type="checkbox" id="toggle-object" />
                    <span>Object detection</span>
                  </label>
                  <!-- Hand gestures: hidden, disabled by default -->
                  <label class="toggle" hidden>
                    <input type="checkbox" id="toggle-gesture" />
                    <span>Hand gestures</span>
                  </label>
                  <label class="toggle">
                    <input type="checkbox" id="toggle-face-detect" />
                    <span>Face detection</span>
                  </label>
                  <!-- Face style: hidden, dots by default -->
                  <label class="toggle select-toggle" hidden>
                    <span>Face style</span>
                    <select id="face-style">
                      <option value="mesh">Mesh</option>
                      <option value="dots" selected>Dots</option>
                    </select>
                  </label>
                  <!-- Pose joints: hidden, enabled by default -->
                  <label class="toggle" hidden>
                    <input type="checkbox" id="toggle-pose-joints" checked />
                    <span>Pose joints</span>
                  </label>
                  <!-- Pose trails: hidden, enabled by default -->
                  <label class="toggle" hidden>
                    <input type="checkbox" id="toggle-pose-trails" checked />
                    <span>Pose trails</span>
                  </label>
                  <label class="toggle slider-toggle">
                    <span>Overlay thickness <span id="overlay-thickness-value" class="slider-value">1.00×</span></span>
                    <input type="range" id="overlay-thickness" min="0.25" max="3" step="0.25" value="1" />
                  </label>
                  <label class="toggle slider-toggle">
                    <span>Face dot density <span id="face-dot-density-value" class="slider-value">1</span></span>
                    <input type="range" id="face-dot-density" min="1" max="10" step="1" value="1" />
                  </label>
                </div>
              </details>
            </section>

            <section class="control-section">
              <details class="cv-dropdown">
                <summary class="control-title cv-summary">Nonverbal analysis</summary>
                <div class="cv-dropdown-content">
                  <section class="field prompt-field">
                    <div class="prompt-actions">
                      <button
                        type="button"
                        id="show-analytics-btn"
                        class="ghost-btn"
                        style="display: none; align-items: center; justify-content: center;"
                      >
                        View Analytics
                      </button>
                      <button type="button" id="submit-btn" class="ghost-btn" style="display: none;">Behavior Analysis</button>
                    </div>
                  </section>
                </div>
              </details>
            </section>
          </form>

          <div id="library-panel" class="library-panel" hidden>
            <h2 class="control-title">Library</h2>
            <div id="library-grid" class="library-grid"></div>
          </div>

          <!-- Hidden video/image source for MediaPipe -->
          <video id="preview" autoplay muted playsinline style="display:none;"></video>
          <img id="image-preview" hidden />

          <div class="center-column">
            <div class="players-panel vertical" hidden>
              <div class="player-card">
                <div class="video-placeholder" id="video-placeholder"></div>
                <div class="canvas-placeholder" id="canvas-placeholder"></div>
                <canvas id="landmark-canvas" width="640" height="360"></canvas>
                <div id="live-overlay" class="live-overlay" hidden>
                  <span id="live-status" class="live-status"></span>
                  <button type="button" id="live-save-btn" class="live-save-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
                    Save & analise 10s
                  </button>
                </div>
                <div class="transport-bar" id="transport-bar">
                  <button type="button" class="transport-btn" id="transport-play" aria-label="Play / pause">
                    <svg id="transport-play-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
                    <svg id="transport-pause-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" hidden><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
                  </button>
                  <div class="transport-timeline" id="transport-timeline">
                    <div class="transport-progress" id="transport-progress"></div>
                  </div>
                  <span class="transport-time" id="transport-time">0:00 / 0:00</span>
                </div>
                <div class="player-actions">
                  <div id="capture-frame-group" class="capture-btn-group" style="display: none;">
                    <button type="button" id="capture-frame-btn" class="ghost-btn capture-main">Capture Frame</button>
                    <button type="button" id="capture-frame-menu-toggle" class="ghost-btn capture-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="capture-frame-menu" aria-label="Capture options" title="Capture options">▾</button>
                    <div id="capture-frame-menu" class="capture-menu" role="menu" hidden>
                      <div class="capture-menu-current" id="capture-frame-menu-current">Saving to: Default</div>
                      <button type="button" id="capture-frame-dest-btn" class="capture-menu-item" role="menuitem">Pick folder…</button>
                      <button type="button" id="capture-frame-dest-clear-btn" class="capture-menu-item" role="menuitem" hidden>Reset to default</button>
                    </div>
                  </div>
                  <button type="button" id="capture-frameset-btn" class="ghost-btn" style="display: none;">Capture Frame Set</button>
                  <button type="button" id="archive-analytics-btn" class="ghost-btn" style="display: none;">Nonverbal analysis</button>
                </div>
              </div>
            </div>

            <div class="analytics-bottom-panel" id="analytics-bottom" hidden>
              <div class="panel-tabs" role="tablist">
                <button type="button" class="panel-tab active" id="tab-data" role="tab">Emotions AI</button>
                <button type="button" class="panel-tab" id="tab-ai" role="tab" hidden>Behavior Analysis</button>
              </div>
              <div class="analytics-bottom-body">
                <div class="panel-view" id="view-data">
                  <div class="analytics-data-row">
                    <div class="output-card emotion-diagram-card" id="emotion-wheel-container">
                      <div class="circumplex-stage">
                        <object id="circumplex-svg" type="image/svg+xml" data="/assets/circumplex_diagram.svg"></object>
                      </div>
                    </div>
                    <div class="output-card blendshapes-card">
                      <ul id="blend-shape-list" class="blend-shapes-list"></ul>
                    </div>
                  </div>
                </div>
                <div class="panel-view" id="view-ai" hidden>
                  <div class="output-card fill-height">
                    <h3>Behavior Analysis</h3>
                    <div id="ai-controls">
                      <label class="prompt-preset-row">
                        <span class="prompt-preset-label">Preset</span>
                        <select id="prompt-preset" class="prompt-preset-select"></select>
                      </label>
                      <button type="button" id="toggle-prompt" class="ghost-btn">Customize prompt</button>
                      <textarea id="prompt" name="prompt" rows="10" hidden placeholder="Modify the default prompt here"></textarea>
                      <button type="button" id="send-analysis-btn">Send for Analysis</button>
                    </div>
                    <section id="status" class="status" hidden></section>
                    <section id="result" class="result scrollable" hidden>
                      <button type="button" id="fullscreen-result-btn" class="fullscreen-btn" aria-label="Open fullscreen" title="Open fullscreen">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                          <polyline points="15,3 21,3 21,9"/><line x1="21" y1="3" x2="14" y2="10"/>
                          <polyline points="9,21 3,21 3,15"/><line x1="3" y1="21" x2="10" y2="14"/>
                        </svg>
                      </button>
                      <div id="result-text"></div>
                    </section>
                  </div>
                </div>
              </div>
            </div>
          </div>
          </div><!-- .workspace-body -->
        </section>

        <div id="fullscreen-overlay" class="fullscreen-overlay" hidden>
          <div class="fullscreen-header">
            <span class="fullscreen-title">Behavior Analysis</span>
            <button type="button" id="fullscreen-close-btn" class="fullscreen-close-btn" aria-label="Close fullscreen" title="Close">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
          <div id="fullscreen-result-content" class="fullscreen-content"></div>
        </div>
      </main>
    </div>

    <!-- Time range selection popup -->
    <div id="frameset-popup" class="frameset-popup" hidden>
      <div class="frameset-popup-box">
        <h3 class="frameset-popup-title">Capture Frame Set</h3>
        <p class="frameset-popup-desc">Export 1 frame every 3 seconds for selected range</p>
        <label class="frameset-label">
          <span>Destination folder</span>
          <div class="frameset-row">
            <input type="text" id="frameset-dest" class="frameset-input" placeholder="assets/export/frames/..." />
            <button type="button" id="frameset-pick-btn" class="ghost-btn">Pick…</button>
          </div>
          <small class="frameset-help">Folder will be created if missing</small>
        </label>
        <label class="frameset-label">
          <span>Filename prefix</span>
          <input type="text" id="frameset-prefix" class="frameset-input" placeholder="frame_..." />
          <small class="frameset-help">Files saved as &lt;prefix&gt;_mm-ss.png</small>
        </label>
        <div class="frameset-popup-fields">
          <label class="frameset-label">
            <span>From (mm:ss)</span>
            <input type="text" id="frameset-from" class="frameset-input" value="00:00" placeholder="00:00" />
          </label>
          <label class="frameset-label">
            <span>To (mm:ss)</span>
            <input type="text" id="frameset-to" class="frameset-input" value="00:00" placeholder="00:00" />
          </label>
        </div>
        <button type="button" id="frameset-whole-btn" class="ghost-btn frameset-whole-btn">Whole Video</button>
        <div class="frameset-popup-actions">
          <button type="button" id="frameset-cancel-btn" class="ghost-btn">Cancel</button>
          <button type="button" id="frameset-start-btn">Start Export</button>
        </div>
      </div>
    </div>

    <!-- Export progress overlay -->
    <div id="export-overlay" class="export-overlay" hidden>
      <div class="export-overlay-box">
        <h3 class="export-overlay-title">Exporting frames...</h3>
        <p class="export-overlay-status" id="export-status">Frame 0 / 0</p>
        <div class="export-progress-track">
          <div class="export-progress-bar" id="export-progress-bar"></div>
        </div>
        <button type="button" id="export-stop-btn" class="ghost-btn">Stop</button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
