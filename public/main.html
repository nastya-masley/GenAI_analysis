<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scans</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 100%; height: 100%; background: #000508; overflow: hidden;
                   font-family: 'Courier New', monospace; color: #fff; }
      #loading-canvas, #globe-canvas {
        position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1;
      }
      #globe-canvas { display: none; z-index: 2; }
      #loading-overlay {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: transparent; pointer-events: none;
      }
      #loading-overlay h1 {
        font-size: 1rem; letter-spacing: 0.3em; text-transform: uppercase;
        color: rgba(255,255,255,0.6); font-weight: 300;
      }
      body.main #loading-canvas { display: none; }
      body.main #loading-overlay { display: none; }
      body.main #globe-canvas { display: block; }

      /* Video overlay: 80% of screen, 16:9, flat */
      #video-overlay {
        display: none;
        position: fixed; inset: 0;
        z-index: 100;
        background: rgba(0,0,0,0.9);
        align-items: center;
        justify-content: center;
      }
      #video-overlay.visible { display: flex; }
      #video-overlay-inner {
        width: 80vw;
        height: 80vh;
        position: relative;
        background: #000;
        aspect-ratio: 16 / 9;
      }
      #video-overlay-inner video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #video-overlay-close {
        position: absolute;
        top: -12px;
        right: -12px;
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: #fff;
        color: #000;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        z-index: 101;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #video-overlay-close:hover { background: #ccc; }
    </style>
  </head>
  <body>
    <canvas id="loading-canvas"></canvas>
    <canvas id="globe-canvas"></canvas>
    <div id="loading-overlay">
      <h1>Loading</h1>
    </div>
    <div id="video-overlay">
      <div id="video-overlay-inner">
        <video id="video-overlay-video" muted loop playsinline></video>
        <button id="video-overlay-close" type="button" aria-label="Close">×</button>
      </div>
    </div>
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.js" } }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
