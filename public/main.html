<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scan Viewer</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 100%; height: 100%; background: #000508; overflow: hidden;
                   font-family: 'Courier New', monospace; color: #fff; }
      #app-canvas {
        position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      }
      #loading-overlay {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; background: #000508; transition: opacity 0.6s ease;
      }
      #loading-overlay.fade-out { opacity: 0; pointer-events: none; }
      #loading-overlay h1 {
        font-size: 0.75rem; letter-spacing: 0.4em; text-transform: uppercase;
        color: rgba(255,255,255,0.5); font-weight: 300;
      }
      #progress-bar-wrap {
        width: 180px; height: 1px; background: rgba(255,255,255,0.12);
      }
      #progress-bar {
        height: 100%; width: 0%; background: rgba(100,210,255,0.7);
        transition: width 0.2s ease;
      }
      #hint {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase;
        color: rgba(255,255,255,0.2); pointer-events: none; z-index: 5;
        opacity: 0; transition: opacity 1s ease;
      }
      #hint.visible { opacity: 1; }

      /* ── Video player overlay ── */
      #video-overlay {
        display: none; position: fixed; inset: 0; z-index: 50;
        background: rgba(0,0,0,0.88);
        align-items: center; justify-content: center;
      }
      #video-overlay.open { display: flex; }
      #video-overlay-inner {
        position: relative; width: min(82vw, 960px);
        aspect-ratio: 16/9; background: #000; border-radius: 4px;
        box-shadow: 0 0 60px rgba(0,180,255,0.15);
      }
      #video-overlay-inner video {
        width: 100%; height: 100%; display: block; border-radius: 4px;
      }
      #video-overlay-close {
        position: absolute; top: -14px; right: -14px;
        width: 36px; height: 36px; border-radius: 50%;
        border: none; background: #fff; color: #000;
        font-size: 20px; line-height: 1; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      #video-overlay-close:hover { background: #ddd; }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>

    <div id="loading-overlay">
      <h1>Loading</h1>
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    </div>

    <div id="hint"></div>

    <div id="video-overlay">
      <div id="video-overlay-inner">
        <video id="overlay-video" src="/assets/MVI_3101.MP4"
               controls playsinline preload="metadata"></video>
        <button id="video-overlay-close" aria-label="Close">&#x2715;</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
